[tools]
node = "24"

[tasks.install]
description = "Install the build toolchain (esbuild)"
run = "npm install --no-audit --no-fund"
sources = ["package.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.build]
description = "Bundle the codecs to repair-codec.js and link-codec.js for the browser"
depends = ["install"]
sources = ["repair-codec.ts", "link-codec.ts"]
outputs = ["repair-codec.js", "link-codec.js"]
run = """
npx esbuild repair-codec.ts --bundle --format=iife --global-name=RePair --target=es2020 \
  --outfile=repair-codec.js
npx esbuild link-codec.ts --bundle --format=iife --global-name=Ylk1 --target=es2020 \
  --outfile=link-codec.js
"""

[tasks.test]
description = "Round-trip tests across the config space, plus a timing run"
depends = ["install"]
run = """
npx esbuild repair-codec.test.ts --bundle --platform=node --format=cjs --outfile=test.cjs
node test.cjs
"""

[tasks.data]
description = "Regenerate the raw and pre-encoded KJV browser data"
depends = ["install"]
sources = ["kjv.csv", "build-kjv-data.js", "build-kjv-preencoded.ts", "repair-codec.ts"]
outputs = ["kjv-data.js", "kjv-preencoded.js"]
run = """
node build-kjv-data.js
npx esbuild build-kjv-preencoded.ts --bundle --platform=node --format=cjs --outfile=/tmp/build-kjv-preencoded.cjs
node /tmp/build-kjv-preencoded.cjs
"""

[tasks.bench-link]
description = "Round-trip the YLK1 link codec and compare it to RPR1 on the KJV"
depends = ["install"]
run = """
npx esbuild link-codec.bench.ts --bundle --platform=node --format=cjs --outfile=/tmp/link-bench.cjs
node --max-old-space-size=4096 /tmp/link-bench.cjs
"""

[tasks.serve]
description = "Serve the repo so demo.html can load its sibling scripts"
depends = ["build"]
run = "npx --yes serve . -l 8080"

[tasks.clean]
description = "Remove generated build output"
run = "rm -f repair-codec.js link-codec.js test.cjs"
